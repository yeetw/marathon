function openForm(d){let form=document.querySelector('#form');form.reset();editing=d?d[11]:null;document.querySelector('#formTitle').textContent=d?'編輯賽事':'新增一場期待';if(d){const values={name:d[1],date:d[0],km:d[2],limit:d[3]||'',time:d[4],place:d[5],finish:finish(d),fee:d[7],website:d[8]||'',route:d[9]||'',tags:tags(d).join('、')};for(const [k,v] of Object.entries(values))form.elements.namedItem(k).value=v}document.querySelector('#formDialog').showModal()}
document.querySelector('#add').onclick=()=>openForm();
document.querySelector('#form').onsubmit=e=>{e.preventDefault();const form=e.target,f=new FormData(form);for(const field of ['website','route']){const input=form.elements.namedItem(field);input.setCustomValidity('');if(f.get(field)&&!safeUrl(f.get(field))){input.setCustomValidity('請輸入 http 或 https 連結');input.reportValidity();return}}const id=editing||'custom-'+Date.now()+'-'+Math.random().toString(36).slice(2,8);const d=[f.get('date'),f.get('name').trim(),+f.get('km'),+f.get('limit')||0,f.get('time'),f.get('place').trim(),f.get('finish').trim()||'待補充',+f.get('fee'),f.get('website').trim(),f.get('route').trim(),[...new Set(f.get('tags').split(/[\s,，、;；]+/).map(t=>t.replace(/^#+/,'')).filter(Boolean))],id];try{if(editing){const updated={...overrides,[id]:d};localStorage.setItem('rundays-overrides',JSON.stringify(updated));overrides=updated}else{const updated=[...extras,d];localStorage.setItem('rundays',JSON.stringify(updated));extras=updated}}catch{alert('儲存失敗，請確認瀏覽器允許本機儲存後再試。');return}data=collect();if(!editing)tab=days(d[0])<0?'past':'upcoming';document.querySelector('#formDialog').close();render()};
for(const field of ['website','route'])document.querySelector('#form').elements.namedItem(field).oninput=e=>e.target.setCustomValidity('');render();
</script></html>
