</style><main><div class="top"><div><p>Life is a Marathon.</p><h1>阿胖呆跑跑</h1><p>I'm looking for a water station.</p></div></div><section class="hero"><div class="herotext"><span class="pill">● NEXT RACE　下一場賽事</span><h2 id="heroTitle"></h2><p id="heroPlace"></p><div class="meta" id="heroMeta"></div></div><div class="count"><span>距離起跑還有</span><strong id="count"></strong><span>DAYS TO GO</span></div></section><section class="stats" id="stats"></section><div class="tabs"><button data-tab="upcoming" class="active">即將起跑</button><button data-tab="past">過往賽事</button><button data-tab="all">全部賽事</button></div><div class="filters"><div class="searchbox"><input id="search" placeholder="⌕　搜尋賽事、起終點或 tag…" aria-label="搜尋賽事"><button id="clearSearch" class="search-clear" type="button" aria-label="清除搜尋" title="清除搜尋" hidden>×</button></div><select id="distance" aria-label="距離篩選"><option value="all">所有距離</option><option value="short">10K 以下（含）</option><option value="mid">10–15K</option><option value="half">半程馬拉松</option></select></div><div class="tablewrap"><table><thead><tr><th>賽事日期 ↓</th><th>賽事名稱 / 起終點</th><th>距離</th><th>限時 (min)</th><th title="限時 ÷ 距離；平均每公里需在此時間內完成">至少幾分速</th><th>起跑時間</th><th>報名費</th><th>賽事狀態</th><th>官方連結</th><th></th></tr></thead><tbody id="rows"></tbody></table><div class="empty" hidden>沒有符合條件的賽事，試試其他關鍵字。</div></div><div class="footer"><span id="total"></span><span>資料依提供的清單整理 · 實際資訊以主辦公告為準</span></div></main><dialog id="detail"><button class="close" onclick="this.closest('dialog').close()">×</button><div id="detailBody"></div></dialog><script>
const raw = {{ site.data.races | jsonify }}.map((r,i)=>[r.date,r.name,Number(r.distance),Number(r.limit)||0,r.time,r.start,r.finish,Number(r.fee)||0,r.website||'',r.route||'',r.tags||[],'race-'+i]);
let data=raw,tab='upcoming';
function safeUrl(value){try{const u=new URL(value);return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return ''}}
function tags(d){return Array.isArray(d[10])?d[10]:[]}
function finish(d){return d[6]==='同起點'?d[5]:d[6]}
function official(d){return [[8,'官方網站'],[9,'官方路線圖']].map(([i,label])=>{let u=safeUrl(d[i]);return u?`<a href="${escape(u)}" target="_blank" rel="noopener noreferrer">${label} ↗</a>`:`<span class="muted">${label}未填</span><br>`}).join('')}
const today=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());const days=d=>Math.round((Date.parse(d+'T00:00:00+08:00')-Date.parse(today+'T00:00:00+08:00'))/86400000),escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){document.querySelector('#clearSearch').hidden=!document.querySelector('#search').value;data.sort((a,b)=>a[0].localeCompare(b[0]));let next=data.find(d=>days(d[0])>=0);document.querySelector('#heroTitle').textContent=next?next[0].slice(0,4)+' '+next[1]:'下一場風景，等你出發';document.querySelector('#heroPlace').textContent=next?'起點 · '+next[5]+'\n終點 · '+finish(next):'尚無即將起跑的賽事';document.querySelector('#count').textContent=next?days(next[0]):'—';document.querySelector('#heroMeta').textContent=next?`☁️ ${next[0].replaceAll('-','.')}　　🏃 ${next[4]} 起跑　　✨ ${next[2]} K\n🐈 限時 ${next[3]?next[3]+' min':'待補充'}`:'';let upcoming=data.filter(d=>days(d[0])>=0),past=data.filter(d=>days(d[0])<0);document.querySelector('#stats').innerHTML=[['即將起跑',upcoming.length,'場'],['路跑經驗',data.length,'場'],['最長距離',past.length?Math.max(...past.map(d=>d[2])):0,'K'],['路跑里程',past.reduce((s,d)=>s+d[2],0).toFixed(1),'K']].map(x=>`<div class="stat"><label>${x[0]}</label><strong>${x[1]}<small>${x[2]}</small></strong></div>`).join('');let q=document.querySelector('#search').value.toLowerCase(),f=document.querySelector('#distance').value,list=data.filter(d=>(tab==='all'||(tab==='past'?days(d[0])<0:days(d[0])>=0))&&[d[1],d[5],finish(d),...tags(d)].join(' ').toLowerCase().includes(q.trim())&&(f==='all'||(f==='short'?d[2]<=10:f==='mid'?d[2]>10&&d[2]<=15:d[2]>=21)));list.sort((a,b)=>tab==='upcoming'?a[0].localeCompare(b[0]):b[0].localeCompare(a[0]));document.querySelector('#rows').innerHTML=list.map(d=>`<tr><td class="date">${d[0].slice(5).replace('-',' / ')}<small>${d[0].slice(0,4)} · ${['SUN','MON','TUE','WED','THU','FRI','SAT'][new Date(d[0]+'T12:00:00').getDay()]}</small></td><td class="race">${escape(d[1])}<small class="locations">起點 · ${escape(d[5])}<br>終點 · ${escape(finish(d))}</small>${tags(d).map(t=>`<button class="tag" data-tag="${escape(t)}">#${escape(t)}</button>`).join('')}</td><td class="distance">${d[2]}<span style="font-weight:400;color:#7b8796"> K</span></td><td class="limit">${d[3]||'待補充'}</td><td class="pace" title="平均每公里需在此時間內完成">${d[3]?'<strong>'+(d[3]/d[2]).toFixed(1).replace(/\.0$/,'')+'</strong><small> min/K</small>':'待補充'}</td><td>${d[4]}</td><td>NT$ ${d[7].toLocaleString()}</td><td><span class="badge">${days(d[0])<0?'已過賽事':days(d[0])===0?'今天起跑':'倒數 '+days(d[0])+' 天'}</span></td><td class="official">${official(d)}</td><td><button class="details" data-index="${data.indexOf(d)}">詳情 ↗</button></td></tr>`).join('');document.querySelector('.empty').hidden=!!list.length;document.querySelector('#total').textContent=`顯示 ${list.length} 場賽事，共收錄 ${data.length} 場`;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===tab))}
document.querySelectorAll('[data-tab],[data-nav]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab||b.dataset.nav;render()});function clearSearch(){document.querySelector('#search').value='';render();document.querySelector('#search').focus()}document.querySelector('#clearSearch').onclick=clearSearch;document.querySelector('#search').onkeydown=e=>{if(e.key==='Escape'&&!e.isComposing){e.preventDefault();clearSearch()}};document.querySelector('#search').oninput=render;document.querySelector('#distance').onchange=render;document.querySelector('#rows').onclick=e=>{let tag=e.target.closest('[data-tag]');if(tag){document.querySelector('#search').value=tag.dataset.tag;render();return}let b=e.target.closest('[data-index]');if(!b)return;let d=data[+b.dataset.index],pace=d[3]/d[2];document.querySelector('#detailBody').innerHTML=`<span class="eyebrow">RACE DETAILS</span><h2>${escape(d[1])}</h2><p>賽事日期：${d[0]}<br>起跑時間：${d[4]}<br>距離：${d[2]} K<br>限時：${d[3]?d[3]+" 分鐘":"待補充"}<br>完賽平均配速上限：${d[3]?Math.floor(pace)+" 分 "+Math.round(pace%1*60)+" 秒／公里":"待補充"}<br>起點：${escape(d[5])}<br>終點：${escape(finish(d))}<br>報名費：NT$ ${d[7].toLocaleString()}</p><div class="official">${official(d)}</div><div>${tags(d).map(t=>`<span class="tag">#${escape(t)}</span>`).join('')}</div>`;document.querySelector('#detail').showModal()};render();
</script></html>
